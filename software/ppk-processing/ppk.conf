# RTKLIB rnx2rtkp options - kinematic PPK, drone (rover) vs village pillar (base)
# Starting point: compare against the demo config shipped with your RTKLIB version.
pos1-posmode       =kinematic
pos1-frequency     =l1+l2
pos1-soltype       =combined
pos1-elmask        =15
pos1-snrmask_r     =off
pos1-snrmask_b     =off
pos1-dynamics      =off
pos1-tidecorr      =off
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-navsys        =45
pos2-armode        =fix-and-hold
pos2-gloarmode     =off
pos2-arthres       =3
pos2-arminfix      =10
pos2-elmaskhold    =15
pos2-slipthres     =0.05
pos2-maxage        =30
pos2-rejionno      =1000
pos2-rejgdop       =30
pos2-niter         =1
out-solformat      =llh
out-outhead        =on
out-outopt         =on
out-outvel         =off
out-timesys        =gpst
out-timeform       =hms
out-timendec       =3
out-degform        =deg
out-height         =ellipsoidal
out-solstatic      =all
stats-eratio1      =100
stats-eratio2      =100
stats-errphase     =0.003
stats-errphaseel   =0.003
stats-errphasebl   =0
stats-errdoppler   =1
stats-snrmax       =52
stats-prnaccelh    =1
stats-prnaccelv    =0.1
stats-prnbias      =0.0001
stats-prniono      =0.001
stats-prntrop      =0.0001
stats-clkstab      =5e-12
ant1-postype       =llh
ant2-postype       =llh
# base coordinates are passed on the command line with -l (see run_ppk.py)
